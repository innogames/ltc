[pytest]
; SQLite by default so tests run anywhere; use --ds=ltc.settings for
; a real PostgreSQL run.
DJANGO_SETTINGS_MODULE = ltc.test_settings
; only app tests.py modules — keeps ltc/test_settings.py out of collection
python_files = tests.py
; only *TestCase classes — Django models named Test* are not test classes
python_classes = *TestCase
; never collect from build outputs or the SPA
norecursedirs = build-deb frontend .venv .test-venv
